name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck, tests, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      # Falla con links, anclas, rutas duplicadas o imágenes rotas (onBroken* en 'throw').
      - name: Build
        run: npm run build

      - name: Lista de bloqueo de datos personales
        run: npm run bloqueo -- build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (contra el build servido)
        run: npm run test:e2e

      # El reporte no incluye storageState ni datos de sesión (el sitio no tiene login).
      # Los traces solo se generan en el primer reintento.
      - name: Subir el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binario oficial en lugar de gitleaks-action: la acción pide licencia en repos de organizaciones.
      - name: Instalar gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version

      - name: Buscar secretos en el historial
        run: ./gitleaks detect --source . --redact --verbose
