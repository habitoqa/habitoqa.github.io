name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Validaciones, tests, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validar competencias.json y el frontmatter de las guías
        run: npm run validar

      - name: Tests unitarios
        run: npm test

      - name: Lista de bloqueo de datos personales (fuente versionada)
        run: npm run bloqueo

      # Falla con links, anclas, rutas duplicadas o imágenes rotas (onBroken* en 'throw').
      - name: Build
        run: npm run build

      - name: Lista de bloqueo de datos personales (build, sin excepciones)
        run: npm run bloqueo:build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (contra el build servido)
        run: npm run test:e2e

      # Es el build que verificó este job: el deploy publica este mismo artefacto, no uno nuevo.
      - name: Subir el build verificado
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Sin login ni storageState: el reporte no lleva datos de sesión. Los traces salen solo en el primer reintento.
      - name: Subir el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Binario oficial con verificación de checksum: gitleaks-action pide licencia en repos de organizaciones.
      - name: Instalar gitleaks 8.30.1
        run: |
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfLO "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${BASE}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: Buscar secretos en el historial
        run: ./gitleaks git --redact --verbose .
